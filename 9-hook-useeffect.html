<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study of React core concepts</title>
</head>

<body>
    <div id="root"></div>
        
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

                
    <script type="text/babel">

        function ExampleComponentUseEffect() {
            const [count, setCount] = React.useState(0);
            const [name, setName] = React.useState('');


            // Counter useEffect
            React.useEffect(() => {
                console.log('Component mounted Count');

                return () => {
                    console.log('Component unmounted Count');
                };
            }, [count]);

            // Name useEffect
            React.useEffect(() => {
                console.log('Component mounted Name');

                return () => {
                    console.log('Component unmounted Name');
                };
            }, [name]);

            return (
                <>
                    <p> Hook useEffect() </p>
                    
                    <hr></hr>
                    <p>Count: {count}</p>
                    <button type="button" onClick={() => setCount((preValue) =>preValue + 1)}>Increase Count</button>                    
                    
                    <hr></hr>
                    <p>Name: {name}</p>
                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} />
                </>

            )

        }



        function App(){
            return (
                <main>
                    <ExampleComponentUseEffect/>                        
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <App/>
        )             

    </script>
    
</body>
</html>
