<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study of React core concepts</title>
</head>

<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

                
    <script type="text/babel">
       
       
        function Counter(){
            const [ counter, setCounter ] = React.useState(0);

            if(counter > 15){
                return <h1>Counter exceeded 15, component unmounted</h1>
            }

            return (
                <>                    
                    <p>Counter: {counter}</p>

                    <br/><br/>
                    <button type="button" onClick={() => setCounter(counter + 1)}>Update Counter</button>

                    <br/><br/>
                    <button type="button" onClick={() => setCounter((preValue) => preValue + 1)}>Update Counter Prevalue</button>

                    <br/><br/>
                    //Conditional Rendering using Ternary Operator
                    <p>{counter > 5 ? 'Counter is greater than 5' : 'Counter is less than or equal to 5'}</p>
                    
                    <br/><br/>
                    // Conditional Rendering using &&
                    {counter > 10 && <p>Counter is greater than 10</p>}

                </>
            )
        }

        function App(){
            return (
                <main>
                    <Counter/>
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <App/>
        )             

    </script>
    
</body>
</html>
